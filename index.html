<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>익명 이미지 게시판</title>
<style>
  :root { --bg:#fafafa; --card:#fff; --text:#1c1c1c; --muted:#737373; --line:#dbdbdb; --accent:#0095f6; --heart:#ff3040; --soft:#efefef; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#121212; --text:#f5f5f5; --muted:#a8a8a8; --line:#2a2a2a; --accent:#3aa5ff; --heart:#ff3040; --soft:#262626; }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
         background:var(--bg); color:var(--text); font-size:14px; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  input, textarea { font:inherit; color:var(--text); }
  header.bar { position:sticky; top:0; z-index:10; background:var(--card); border-bottom:1px solid var(--line); }
  header.bar div { max-width:470px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; }
  header.bar h1 { font-size:18px; margin:0; letter-spacing:-.2px; }
  header.bar .new { font-weight:600; color:var(--accent); }
  main { max-width:470px; margin:0 auto; padding:16px 0 48px; }

  /* ---------- 글쓰기 ---------- */
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; margin:0 0 16px; }
  @media (max-width:500px) { .card { border-radius:0; border-left:0; border-right:0; } }
  #composer { padding:16px; }
  #composer h2 { font-size:15px; margin:0 0 12px; }
  #drop { display:block; border:2px dashed var(--line); border-radius:10px; padding:28px 12px; text-align:center; cursor:pointer; transition:border-color .15s; }
  #drop.over { border-color:var(--accent); }
  #drop span { color:var(--muted); font-size:13px; }
  input[type=file] { display:none; }
  #thumbs { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  #thumbs:empty { display:none; }
  .thumb { position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden; background:var(--soft); }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .x { position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:50%; background:rgba(0,0,0,.6); color:#fff; font-size:14px; line-height:24px; }
  .thumb .n { position:absolute; left:6px; bottom:4px; color:#fff; font-size:12px; text-shadow:0 0 3px #000; }
  .thumb.add { display:flex; align-items:center; justify-content:center; border:2px dashed var(--line); background:none; color:var(--muted); font-size:28px; }
  .field { display:block; width:100%; margin-top:10px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); }
  textarea.field { resize:vertical; min-height:60px; }
  .hint { color:var(--muted); font-size:12px; margin-top:6px; }
  .primary { margin-top:12px; width:100%; padding:10px; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; }
  .primary:disabled { opacity:.45; cursor:default; }
  #status { margin-top:10px; font-size:13px; color:var(--muted); min-height:18px; }

  /* ---------- 피드 ---------- */
  .post .head { display:flex; align-items:center; gap:10px; padding:10px 12px; }
  .avatar { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13px; flex:none; }
  .who { font-weight:600; }
  .anon { color:var(--muted); font-weight:600; }
  .dot { color:var(--muted); }
  .time { color:var(--muted); }
  .media { position:relative; background:var(--soft); aspect-ratio:1; overflow:hidden; user-select:none; }
  .track { display:flex; height:100%; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
  .track::-webkit-scrollbar { display:none; }
  .track img { flex:0 0 100%; width:100%; height:100%; object-fit:contain; scroll-snap-align:center; display:block; -webkit-user-drag:none; }
  .nav { position:absolute; top:50%; transform:translateY(-50%); width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,.85); color:#000; font-size:16px; line-height:28px; box-shadow:0 1px 4px rgba(0,0,0,.3); }
  .nav.prev { left:8px; } .nav.next { right:8px; }
  .count { position:absolute; top:10px; right:10px; background:rgba(0,0,0,.6); color:#fff; font-size:12px; padding:3px 8px; border-radius:12px; }
  .burst { position:absolute; left:50%; top:50%; width:96px; height:96px; margin:-48px 0 0 -48px; fill:#fff; opacity:0; pointer-events:none; filter:drop-shadow(0 2px 8px rgba(0,0,0,.4)); }
  .burst.go { animation:burst .8s ease-out; }
  @keyframes burst { 0%{opacity:0;transform:scale(.4)} 15%{opacity:1;transform:scale(1.15)} 30%{transform:scale(1)} 75%{opacity:1} 100%{opacity:0;transform:scale(1)} }
  .dots { display:flex; justify-content:center; gap:4px; padding-top:10px; height:16px; }
  .dots i { width:6px; height:6px; border-radius:50%; background:var(--line); }
  .dots i.on { background:var(--accent); }
  .actions { display:flex; align-items:center; gap:14px; padding:4px 12px 0; margin-top:-16px; }
  .actions button { display:flex; padding:6px 0; }
  .actions svg { width:24px; height:24px; fill:none; stroke:var(--text); stroke-width:1.9; stroke-linejoin:round; stroke-linecap:round; }
  .actions .like.on svg { fill:var(--heart); stroke:var(--heart); }
  .actions .like.pop svg { animation:pop .35s ease; }
  @keyframes pop { 50%{transform:scale(1.25)} }
  .actions .right { margin-left:auto; }
  .body { padding:4px 12px 12px; line-height:1.45; }
  .likes { font-weight:600; margin:2px 0 6px; }
  .caption, .comment { margin:3px 0; word-break:break-word; white-space:pre-wrap; }
  .caption b, .comment b { margin-right:6px; }
  .more { color:var(--muted); margin:4px 0; display:block; }
  .ago { color:var(--muted); font-size:11px; margin-top:6px; letter-spacing:.2px; }
  .cform { display:flex; align-items:center; gap:8px; border-top:1px solid var(--line); padding:6px 12px; }
  .cform input { flex:1; min-width:0; border:0; background:none; padding:8px 0; outline:none; }
  .cform button { color:var(--accent); font-weight:600; }
  .cform button:disabled { opacity:.4; cursor:default; }
  #more { display:block; margin:8px auto; color:var(--accent); font-weight:600; padding:8px 16px; }
  #empty, #loading { text-align:center; color:var(--muted); padding:24px 0; }
  footer { margin-top:24px; font-size:12px; color:var(--muted); line-height:1.6; text-align:center; padding:0 16px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#262626; color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:20; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<header class="bar"><div>
  <h1>익명 이미지 게시판</h1>
  <button class="new" id="newBtn">+ 새 게시물</button>
</div></header>

<main>
  <section class="card" id="composer">
    <h2>새 게시물</h2>
    <label id="drop">
      <input id="file" type="file" accept="image/*" multiple>
      <strong>사진을 끌어다 놓거나 클릭</strong><br>
      <span>한 번에 최대 3장 · JPG · PNG · GIF · WEBP (큰 사진은 자동 축소)</span>
    </label>
    <div id="thumbs"></div>
    <input class="field" id="nick" maxlength="20" placeholder="닉네임 (선택 · 비워두면 익명)" autocomplete="off">
    <textarea class="field" id="caption" maxlength="500" placeholder="문구 입력 (선택)"></textarea>
    <div class="hint">닉네임은 이 브라우저에만 기억되며 댓글에도 똑같이 쓰여요.</div>
    <button class="primary" id="submit" disabled>공유하기</button>
    <div id="status"></div>
  </section>

  <div id="feed"></div>
  <p id="loading">불러오는 중…</p>
  <p id="empty" hidden>아직 올라온 게시물이 없어요. 첫 사진을 올려보세요!</p>
  <button id="more" hidden>더 보기</button>

  <footer>
    누가 올렸는지(IP 등)는 저장하지 않습니다. 사진의 위치 정보도 올리기 전에 지워집니다.<br>
    닉네임은 직접 입력한 경우에만 표시돼요.
  </footer>
</main>
<div class="toast" id="toast"></div>

<script>
const MAX = 4 * 1024 * 1024;           // Vercel 함수 요청 한도(4.5MB)보다 살짝 작게
const MAX_FILES = 3;
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// ---------- 브라우저 저장 (실패해도 동작하도록) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const liked = new Set(store.get('liked', []));
const saveLiked = () => store.set('liked', [...liked].slice(-2000));
const myNick = () => $('nick').value.trim();

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1600);
}

// ---------- 아이콘 ----------
const ICON = {
  heart: '<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>',
  comment: '<svg viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.1-4.2A8.5 8.5 0 1 1 20.5 12z"/></svg>',
  link: '<svg viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/></svg>',
  burst: '<svg class="burst" viewBox="0 0 24 24"><path d="M12 21.5s-8-4.9-9.9-9.8C.7 8 3.1 4 7 4c2.1 0 3.8 1.1 5 3 1.2-1.9 2.9-3 5-3 3.9 0 6.3 4 4.9 7.7-1.9 4.9-9.9 9.8-9.9 9.8z"/></svg>',
};

// ---------- 글쓰기 ----------
let picked = [];   // { file, url }
const fileInput = $('file'), drop = $('drop'), status = $('status');

$('nick').value = store.get('nick', '');
$('nick').addEventListener('input', () => { store.set('nick', myNick()); refreshCommentPlaceholders(); });
$('newBtn').addEventListener('click', () => { $('composer').scrollIntoView({ behavior: 'smooth' }); fileInput.click(); });

fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); });
document.addEventListener('paste', (e) => {
  if (e.target.closest('input, textarea')) return;
  const files = [...e.clipboardData.files].filter((f) => f.type.startsWith('image/'));
  if (files.length) addFiles(files);
});

function addFiles(list) {
  const imgs = [...list].filter((f) => f.type.startsWith('image/'));
  if (!imgs.length) return (status.textContent = '이미지 파일만 올릴 수 있어요.');
  const room = MAX_FILES - picked.length;
  if (imgs.length > room) toast(`한 번에 최대 ${MAX_FILES}장까지만 올릴 수 있어요.`);
  for (const f of imgs.slice(0, Math.max(0, room))) picked.push({ file: f, url: URL.createObjectURL(f) });
  status.textContent = '';
  renderThumbs();
}

function renderThumbs() {
  const box = $('thumbs'); box.innerHTML = '';
  picked.forEach((p, i) => {
    const t = el('div', 'thumb');
    const img = el('img'); img.src = p.url; img.alt = '';
    const x = el('button', 'x', '×'); x.title = '빼기';
    x.onclick = () => { URL.revokeObjectURL(p.url); picked.splice(i, 1); renderThumbs(); };
    t.append(img, x, el('span', 'n', `${i + 1}/${picked.length}`));
    box.append(t);
  });
  if (picked.length && picked.length < MAX_FILES) {
    const add = el('button', 'thumb add', '+'); add.title = '사진 추가';
    add.onclick = () => fileInput.click();
    box.append(add);
  }
  drop.hidden = picked.length > 0;
  $('submit').disabled = picked.length === 0;
}

$('submit').addEventListener('click', async () => {
  if (!picked.length) return;
  const btn = $('submit'); btn.disabled = true;
  try {
    const urls = [];
    for (let i = 0; i < picked.length; i++) {
      status.textContent = picked.length > 1 ? `업로드 중… (${i + 1}/${picked.length})` : '업로드 중…';
      urls.push(await uploadOne(picked[i].file));
    }
    status.textContent = '게시하는 중…';
    const data = await api('/api/posts', { images: urls, nick: myNick(), caption: $('caption').value });
    picked.forEach((p) => URL.revokeObjectURL(p.url));
    picked = []; $('caption').value = ''; renderThumbs();
    status.textContent = '';
    $('empty').hidden = true;
    $('feed').prepend(renderPost(data.post));
    toast('게시됐어요!');
  } catch (err) {
    status.textContent = '오류: ' + err.message;
    btn.disabled = false;
  }
});

async function uploadOne(file) {
  // JPG/PNG는 캔버스로 다시 그려 EXIF(촬영 위치·기기 정보)를 제거하고, 크면 축소
  let blob = file;
  if (file.type !== 'image/gif') blob = await reencode(file);
  if (blob.size > MAX) throw new Error('파일이 너무 커요 (최대 4MB).');
  const res = await fetch('/api/upload', { method: 'POST', headers: { 'content-type': blob.type }, body: blob });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '업로드 실패');
  return data.url;
}

async function reencode(file) {
  const bmp = await createImageBitmap(file);
  let scale = Math.min(1, 2048 / Math.max(bmp.width, bmp.height)), out;
  const type = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
  do {
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scale);
    c.height = Math.round(bmp.height * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    out = await new Promise((r) => c.toBlob(r, type, 0.9));
    scale *= 0.75;
  } while (out.size > MAX && scale > 0.1);
  return out;
}

async function api(url, payload) {
  const res = await fetch(url, payload ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) } : { cache: 'no-store' });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '요청 실패');
  return data;
}

// ---------- 피드 ----------
let nextOffset = 0, loadingFeed = false;

async function loadFeed() {
  if (loadingFeed || nextOffset == null) return;
  loadingFeed = true; $('loading').hidden = false; $('more').hidden = true;
  try {
    const { posts, next } = await api('/api/posts?offset=' + nextOffset);
    const feed = $('feed');
    const shown = new Set([...feed.children].map((c) => c.dataset.id));
    for (const p of posts) if (!shown.has(p.id)) feed.append(renderPost(p));
    nextOffset = next;
    $('empty').hidden = feed.children.length > 0;
  } catch (e) {
    toast('불러오기 실패: ' + e.message);
  } finally {
    loadingFeed = false; $('loading').hidden = true; $('more').hidden = nextOffset == null;
  }
}
$('more').addEventListener('click', loadFeed);
new IntersectionObserver((es) => es[0].isIntersecting && loadFeed(), { rootMargin: '600px' }).observe($('more'));

function avatar(nick) {
  const a = el('div', 'avatar', nick ? [...nick][0].toUpperCase() : '?');
  let h = 0; for (const ch of nick || 'anon') h = (h * 31 + ch.codePointAt(0)) % 360;
  a.style.background = nick ? `hsl(${h} 55% 52%)` : '#9a9a9a';
  return a;
}
const nameEl = (nick) => el('b', nick ? 'who' : 'anon', nick || '익명');

function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return '방금 전';
  if (s < 3600) return `${Math.floor(s / 60)}분 전`;
  if (s < 86400) return `${Math.floor(s / 3600)}시간 전`;
  if (s < 86400 * 7) return `${Math.floor(s / 86400)}일 전`;
  const d = new Date(iso);
  return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
}

function renderPost(p) {
  const card = el('article', 'card post'); card.dataset.id = p.id;

  // 머리
  const head = el('div', 'head');
  head.append(avatar(p.nick), nameEl(p.nick), el('span', 'dot', '•'), el('span', 'time', ago(p.at)));

  // 사진 (여러 장이면 넘겨보기)
  const media = el('div', 'media');
  const track = el('div', 'track');
  p.images.forEach((src, i) => {
    const img = el('img'); img.src = src; img.alt = ''; img.loading = 'lazy'; img.draggable = false;
    if (i === 0) img.onload = () => {
      const r = Math.min(1.91, Math.max(0.8, img.naturalWidth / img.naturalHeight)); // 인스타처럼 4:5 ~ 1.91:1
      media.style.aspectRatio = r;
    };
    track.append(img);
  });
  media.append(track);
  media.insertAdjacentHTML('beforeend', ICON.burst);
  const dots = el('div', 'dots');
  if (p.images.length > 1) {
    const prev = el('button', 'nav prev', '‹'), next = el('button', 'nav next', '›');
    const count = el('span', 'count');
    p.images.forEach(() => dots.append(el('i')));
    const go = (d) => track.scrollBy({ left: d * track.clientWidth, behavior: 'smooth' });
    prev.onclick = () => go(-1); next.onclick = () => go(1);
    const sync = () => {
      const i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
      [...dots.children].forEach((d, j) => d.classList.toggle('on', j === i));
      count.textContent = `${i + 1}/${p.images.length}`;
      prev.hidden = i === 0; next.hidden = i === p.images.length - 1;
    };
    track.addEventListener('scroll', sync, { passive: true });
    media.append(prev, next, count);
    requestAnimationFrame(sync);
  }

  // 버튼들
  const actions = el('div', 'actions');
  const likeBtn = el('button', 'like'); likeBtn.innerHTML = ICON.heart; likeBtn.title = '좋아요';
  const cBtn = el('button'); cBtn.innerHTML = ICON.comment; cBtn.title = '댓글';
  const linkBtn = el('button', 'right'); linkBtn.innerHTML = ICON.link; linkBtn.title = '사진 링크 복사';
  actions.append(likeBtn, cBtn, linkBtn);

  // 본문
  const body = el('div', 'body');
  const likesEl = el('div', 'likes');
  let likes = p.likes || 0;
  const paintLike = () => {
    likeBtn.classList.toggle('on', liked.has(p.id));
    likesEl.textContent = `좋아요 ${likes.toLocaleString()}개`;
  };
  paintLike();
  body.append(likesEl);
  if (p.caption) {
    const cap = el('div', 'caption'); cap.append(nameEl(p.nick), document.createTextNode(p.caption)); body.append(cap);
  }
  const moreBtn = el('button', 'more');
  const list = el('div', 'comments');
  let total = p.commentCount || 0;
  const paintMore = () => { moreBtn.hidden = total <= list.children.length; moreBtn.textContent = `댓글 ${total}개 모두 보기`; };
  (p.comments || []).forEach((c) => list.append(renderComment(c)));
  paintMore();
  moreBtn.onclick = async () => {
    moreBtn.textContent = '불러오는 중…';
    try {
      const { comments } = await api('/api/comments?id=' + encodeURIComponent(p.id));
      list.innerHTML = ''; comments.forEach((c) => list.append(renderComment(c)));
      total = Math.max(total, comments.length);
    } catch (e) { toast(e.message); }
    paintMore();
  };
  body.append(moreBtn, list, el('div', 'ago', ago(p.at)));

  // 댓글 입력
  const form = el('form', 'cform');
  const input = el('input'); input.maxLength = 300; input.dataset.cinput = '1';
  const send = el('button', null, '게시'); send.disabled = true;
  input.placeholder = commentPlaceholder();
  input.addEventListener('input', () => (send.disabled = !input.value.trim()));
  form.append(input, send);
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim(); if (!text) return;
    send.disabled = true;
    try {
      const { comment, count } = await api('/api/comments', { id: p.id, nick: myNick(), text });
      list.append(renderComment(comment)); total = Math.max(count, list.children.length);
      input.value = ''; paintMore();
    } catch (err) { toast(err.message); send.disabled = false; }
  });

  // 좋아요 (한 브라우저당 1번, 다시 누르면 취소)
  let busy = false;
  async function toggleLike(force) {
    const on = force ?? !liked.has(p.id);
    if (on === liked.has(p.id) || busy) return;
    busy = true;
    on ? liked.add(p.id) : liked.delete(p.id); saveLiked();
    likes = Math.max(0, likes + (on ? 1 : -1)); paintLike();
    if (on) { likeBtn.classList.remove('pop'); void likeBtn.offsetWidth; likeBtn.classList.add('pop'); }
    try { likes = (await api('/api/like', { id: p.id, on })).likes; }
    catch (e) { on ? liked.delete(p.id) : liked.add(p.id); saveLiked(); likes = Math.max(0, likes + (on ? -1 : 1)); toast('좋아요 실패: ' + e.message); }
    busy = false; paintLike();
  }
  likeBtn.onclick = () => toggleLike();
  // 사진 두 번 탭 → 좋아요 (인스타처럼)
  const burst = media.querySelector('.burst');
  const heartBurst = () => { burst.classList.remove('go'); void burst.offsetWidth; burst.classList.add('go'); toggleLike(true); };
  media.addEventListener('dblclick', heartBurst);
  let lastTap = 0;
  media.addEventListener('touchend', (e) => {
    if (e.target.closest('.nav')) return;
    const now = Date.now();
    if (now - lastTap < 300) { e.preventDefault(); heartBurst(); lastTap = 0; } else lastTap = now;
  });
  cBtn.onclick = () => input.focus();
  linkBtn.onclick = async () => {
    const i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
    try { await navigator.clipboard.writeText(p.images[i] || p.images[0]); toast('사진 링크를 복사했어요.'); }
    catch { toast('복사하지 못했어요.'); }
  };

  card.append(head, media, dots, actions, body, form);
  if (p.images.length < 2) dots.style.height = '0', dots.style.paddingTop = '16px';
  return card;
}

function renderComment(c) {
  const d = el('div', 'comment');
  d.append(nameEl(c.nick), document.createTextNode(c.text));
  d.title = ago(c.at);
  return d;
}
const commentPlaceholder = () => myNick() ? `${myNick()}(으)로 댓글 달기…` : '익명으로 댓글 달기…';
function refreshCommentPlaceholders() {
  document.querySelectorAll('[data-cinput]').forEach((i) => (i.placeholder = commentPlaceholder()));
}

loadFeed();
</script>
